services:
  db:
    image: postgres:latest
    container_name: todolist_crud_db
    environment:
      - POSTGRES_USER=springuser
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=todolist_crud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postgres-net
    restart: always

volumes:
  postgres-data:

networks:
  postgres-net:
    driver: bridge
